[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proofmesh"
version = "0.1.0"
description = "A cryptographically verifiable data mesh: signed data products, Merkle-tree integrity, lineage and downstream impact analysis."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["cryptography>=41"]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.27"]
dev = ["pytest>=8", "httpx>=0.27", "fastapi>=0.110", "uvicorn>=0.27"]

[project.scripts]
proofmesh = "proofmesh.cli:main"

[tool.setuptools]
packages = ["proofmesh"]

[tool.setuptools.package-data]
proofmesh = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
